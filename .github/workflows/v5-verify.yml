# Unified V5 .NET verification CI.
#
# Calls the same single entry point used locally (tools/verify-v5.ps1) so CI and a
# local machine produce the same per-project PASS/FAIL evidence with real test
# counts and raw logs. This workflow deliberately covers the .NET tree only: it
# makes no Unity/IL2CPP/Android/iOS claim (those need a licensed Unity editor and
# platform toolchains and are tracked separately).
#
# Local equivalent:
#   powershell -ExecutionPolicy Bypass -File tools\verify-v5.ps1 -Configuration Release
# Logs land under artifacts\verify-v5\<timestamp>\ (summary.log, run-info.txt,
# one log per build/test/copy step, per-invocation runs\<project>\<mode>.meta.txt
# and the raw test-framework failure logs under test-results\<project>\).
# The upload below therefore contains everything needed to name a failing test
# case: the framework log path quoted by dotnet test failures is collected into
# test-results\<project>\ by verify-v5.ps1 before the job ends.

name: v5-verify

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426

      # verify-v5.ps1 resolves dotnet from DOTNET_ROOT/PATH when -DotnetPath is not
      # given; tools/unity/build-shared.ps1 (invoked by the plugin-copy check) uses
      # the same resolution chain. D:\Unity\dotnet does not exist on CI runners.
      - name: Run unified V5 verification
        shell: pwsh
        run: ./tools/verify-v5.ps1 -Configuration Release

      # Always uploaded, including on failure / BLOCKED / no parseable summary:
      # a green claim without the artifact is not evidence. The artifact name
      # carries the run id + attempt so retries never overwrite each other.
      - name: Upload verification logs and test-framework diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-verify-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-v5/**
          if-no-files-found: error
          retention-days: 30
