# Unified V5 .NET verification CI.
#
# Calls tools/ci/verify-v5-table-postgres.ps1, which provisions a real disposable
# PostgreSQL 16.10 cluster (official EDB binaries, SHA-256-pinned, loopback-only,
# worktree artifacts root, dedicated port), proves crash/backup recovery, then
# invokes the existing lobby wrapper and the same single entry point
# used locally (tools/verify-v5.ps1, unmodified) so CI and a local machine
# produce the same per-project PASS/FAIL evidence with real test counts and raw
# logs with both table and lobby tests running against real PostgreSQL.
# This workflow deliberately covers the .NET tree only: it makes no
# Unity/IL2CPP/Android/iOS claim (those need a licensed Unity editor and
# platform toolchains and are tracked separately).
#
# Local equivalent:
#   powershell -ExecutionPolicy Bypass -File tools\ci\verify-v5-table-postgres.ps1 -Configuration Release -RunUnifiedVerification
# Logs land under artifacts\verify-v5\<timestamp>\ (summary.log, run-info.txt,
# one log per build/test/copy step, per-invocation runs\<project>\<mode>.meta.txt
# and the raw test-framework failure logs under
# test-results\<project>\<mode>\<project-relative path>\, kept per runner
# invocation) plus the wrapper's own pg\ subtree (start/migrate/cleanup logs,
# cluster server logs, ownership marker, wrapper-summary.json, SHA-256
# manifest). The upload below therefore contains everything needed to name a
# failing test case: the framework log path quoted by dotnet test failures is
# collected into that subtree by verify-v5.ps1 before the job ends. No temp
# database content or secret is uploaded: the disposable cluster uses trust
# auth (no password) and exists only inside the job's own TEMP root, deleted
# by the accepted cleanup script before the job ends.

name: v5-verify

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426

      # The wrapper resolves dotnet from DOTNET_ROOT/PATH when -DotnetPath is not
      # given (setup-dotnet sets both); tools/unity/build-shared.ps1 (invoked by
      # the plugin-copy check) uses the same resolution chain. D:\Unity\dotnet
      # does not exist on CI runners, and the wrapper never hardcodes it.
      # Use the same Windows PowerShell 5.1 host used for caller acceptance.
      # Both wrappers keep their existing ownership checks and finally cleanup.
      - name: Run unified V5 verification
        shell: powershell
        run: ./tools/ci/verify-v5-table-postgres.ps1 -Configuration Release -RunUnifiedVerification -LogDir artifacts/verify-v5/table -UnifiedLogDir artifacts/verify-v5/unified

      # Always uploaded, including on failure / BLOCKED / no parseable summary:
      # a green claim without the artifact is not evidence. The artifact name
      # carries the run id + attempt so retries never overwrite each other.
      - name: Upload verification logs and test-framework diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-verify-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/verify-v5/**
          if-no-files-found: error
          retention-days: 30
