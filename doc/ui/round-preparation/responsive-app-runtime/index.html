:root { color-scheme: dark; }
body { margin: 0; background: #07110d; color: #f1e8cf; font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
header { padding: 28px clamp(18px,4vw,56px) 10px; }
h1 { font-size: clamp(22px,3vw,36px); margin: 0 0 8px; color: #e9c56f; letter-spacing: .04em; }
p { max-width: 1100px; color: #c7c1ad; }
code { color: #9fe0b5; }
.grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(320px,1fr)); gap: 18px; padding: 18px clamp(18px,4vw,56px) 56px; }

.card img { display: block; width: 100%; height: auto; background: #000; }
figcaption { padding: 10px 12px 12px; font-size: 12.5px; color: #cfc7ae; }
figcaption strong { color: #f0d792; font-size: 13.5px; }
.state { color: #85cfa3; word-break: break-all; }
</style>

<header>
<h1>正式 APP 响应式运行截图</h1>
<p>全部来自生产链 <code>MahjongGame → 主菜单 SOLO → GameScreen → 权威准备/发牌</code> 的真实帧缓冲，
不是设计样例渲染器。每张图的窗口、帧缓冲和 stage 矩形见下方；按 16:9 fit，stage 外只显示环境且不接牌桌输入。</p>
<p>参考设计图保留在 <a href="../responsive-validation/index.html">responsive-validation</a>，本目录不被设计测试覆盖。</p>
</header>
