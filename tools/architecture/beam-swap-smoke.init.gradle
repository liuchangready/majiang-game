gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':lwjgl3')
    def out = gradle.rootProject.layout.buildDirectory.dir('beam-swap/smoke-classes')
    def compile = p.tasks.register('compileBeamSwapSmoke', JavaCompile) {
        dependsOn p.tasks.named('classes')
        source gradle.rootProject.file('tools/architecture/BeamSwapRenderSmoke.java')
        classpath = p.sourceSets.main.runtimeClasspath
        destinationDirectory.set(out)
        options.release = 17
        options.encoding = 'UTF-8'
    }
    p.tasks.register('beamSwapSmoke', JavaExec) {
        dependsOn compile
        classpath = p.files(out) + p.sourceSets.main.runtimeClasspath
        mainClass = 'BeamSwapRenderSmoke'
        workingDir = gradle.rootProject.file('assets')
        def width = gradle.rootProject.findProperty('smokeWidth') ?: '1280'
        def disconnect = gradle.rootProject.findProperty('smokeDisconnect') == 'true'
        systemProperty 'smoke.width', width
        systemProperty 'smoke.disconnect', disconnect.toString()
        systemProperty 'smoke.output', gradle.rootProject.file("build/beam-swap/screenshots-${width}${disconnect ? '-disconnect' : ''}").absolutePath
    }
    def presentation = gradle.rootProject.project(':presentation')
    def layoutOut = gradle.rootProject.layout.buildDirectory.dir('beam-swap/layout-smoke-classes')
    def layoutCompile = p.tasks.register('compileBeamSwapLayoutSmoke', JavaCompile) {
        dependsOn p.tasks.named('classes'), presentation.tasks.named('testClasses')
        source gradle.rootProject.file('tools/architecture/BeamSwapLayoutSmoke.java')
        classpath = p.sourceSets.main.runtimeClasspath + presentation.sourceSets.test.runtimeClasspath
        destinationDirectory.set(layoutOut)
        options.release = 17
        options.encoding = 'UTF-8'
    }
    p.tasks.register('beamSwapLayoutSmoke', JavaExec) {
        dependsOn layoutCompile
        classpath = p.files(layoutOut) + p.sourceSets.main.runtimeClasspath + presentation.sourceSets.test.runtimeClasspath
        mainClass = 'BeamSwapLayoutSmoke'
        workingDir = gradle.rootProject.file('assets')
        def width = gradle.rootProject.findProperty('smokeWidth') ?: '1280'
        systemProperty 'smoke.width', width
        systemProperty 'smoke.output', gradle.rootProject.file("build/beam-swap/layout-screenshots-${width}").absolutePath
    }
}
