// Optional real LWJGL/OpenGL verification, without adding production dependencies.
gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':lwjgl3')
    def out = gradle.rootProject.layout.buildDirectory.dir('architecture-v2/desktop-smoke-classes')
    def compile = p.tasks.register('compileArchitectureRenderSmoke', JavaCompile) {
        dependsOn p.tasks.named('classes')
        source gradle.rootProject.files('tools/architecture/V4LocalRenderSmoke.java', 'tools/architecture/DesktopRenderSmoke.java')
        classpath = p.sourceSets.main.runtimeClasspath
        destinationDirectory.set(out)
        options.release = 17
        options.encoding = 'UTF-8'
    }
    p.tasks.register('architectureRenderSmoke', JavaExec) {
        dependsOn compile
        classpath = p.files(out) + p.sourceSets.main.runtimeClasspath
        mainClass = 'DesktopRenderSmoke'
        workingDir = gradle.rootProject.file('assets')
        systemProperty 'smoke.output', gradle.rootProject.file('build/architecture-v2').absolutePath
        doFirst {
            gradle.rootProject.file('build/architecture-v2').mkdirs()
        }
    }
}
