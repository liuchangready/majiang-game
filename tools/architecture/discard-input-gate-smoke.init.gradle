gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':lwjgl3')
    def out = gradle.rootProject.layout.buildDirectory.dir('discard-input-gate/smoke-classes')
    def compile = p.tasks.register('compileDiscardInputGateSmoke', JavaCompile) {
        dependsOn p.tasks.named('classes')
        source gradle.rootProject.file('tools/architecture/DiscardInputGateRenderSmoke.java')
        classpath = p.sourceSets.main.runtimeClasspath
        destinationDirectory.set(out)
        options.release = 17
    }
    p.tasks.register('discardInputGateSmoke', JavaExec) {
        dependsOn compile
        classpath = p.files(out) + p.sourceSets.main.runtimeClasspath
        mainClass = 'DiscardInputGateRenderSmoke'
        workingDir = gradle.rootProject.file('assets')
        systemProperty 'smoke.output', gradle.rootProject.file('build/discard-input-gate').absolutePath
    }
}
