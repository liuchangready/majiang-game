gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':lwjgl3')
    def out = gradle.rootProject.layout.buildDirectory.dir('settlement-detail/smoke-classes')
    def compile = p.tasks.register('compileSettlementDetailSmoke', JavaCompile) {
        dependsOn p.tasks.named('classes')
        source gradle.rootProject.files('tools/architecture/SettlementDetailRenderSmoke.java', 'tools/architecture/V4SmokeSession.java', 'tools/architecture/V4SmokeViews.java')
        classpath = p.sourceSets.main.runtimeClasspath
        destinationDirectory.set(out)
        options.release = 17
    }
    p.tasks.register('settlementDetailSmoke', JavaExec) {
        dependsOn compile
        classpath = p.files(out) + p.sourceSets.main.runtimeClasspath
        mainClass = 'SettlementDetailRenderSmoke'
        workingDir = gradle.rootProject.file('assets')
        systemProperty 'smoke.output', gradle.rootProject.file('build/settlement-detail').absolutePath
    }
}
