gradle.projectsEvaluated {
    def p = gradle.rootProject.project(':lwjgl3')
    def out = gradle.rootProject.layout.buildDirectory.dir('tile-mark-visual/hint-classes')
    def compile = p.tasks.register('compileTileMarkHintSmoke', JavaCompile) {
        dependsOn p.tasks.named('classes')
        source(['TileMarkHintSmoke.java', 'V4SmokeSession.java', 'V4SmokeViews.java'].collect {
            gradle.rootProject.file('tools/architecture/' + it)
        })
        classpath = p.sourceSets.main.runtimeClasspath
        destinationDirectory.set(out)
        options.release = 17
        options.encoding = 'UTF-8'
    }
    p.tasks.register('tileMarkHintSmoke', JavaExec) {
        dependsOn compile
        classpath = p.files(out) + p.sourceSets.main.runtimeClasspath
        mainClass = 'TileMarkHintSmoke'
        workingDir = gradle.rootProject.file('assets')
        systemProperty 'smoke.width', gradle.rootProject.findProperty('smokeWidth') ?: '1280'
        systemProperty 'smoke.height', gradle.rootProject.findProperty('smokeHeight') ?: '720'
        def variant = gradle.rootProject.findProperty('smokeVariant') ?: ''
        systemProperty 'smoke.output', gradle.rootProject.file('build/tile-mark-visual/screenshots' + variant).absolutePath
    }
}
